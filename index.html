<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検2級対策アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --green: #58CC02; --green-dark: #46A302; --green-light: #D7FFB8;
  --blue: #1CB0F6; --blue-light: #DDF4FF;
  --red: #FF4B4B; --red-light: #FFDFE0;
  --purple: #CE82FF; --orange: #FF9600;
  --border: #E5E5E5; --text: #3C3C3C; --text-light: #777;
  --radius: 16px; --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #F7F7F7; color: var(--text); }
.app { max-width: 720px; margin: 0 auto; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }
.bottom-nav { display: flex; border-top: 2px solid var(--border); background: #fff; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 720px; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; gap: 3px; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-light); border-top: 3px solid transparent; }
.nav-item.active { color: var(--blue); border-top-color: var(--blue); }
.nav-icon { font-size: 22px; }
.screen { display: none; flex: 1; overflow-y: auto; padding-bottom: 80px; }
.screen.active { display: block; }

/* HOME */
.home-header { padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between; }
.streak-badge { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; color: var(--orange); }
.xp-badge { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; color: var(--purple); }
.gems-badge { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; color: var(--blue); }
.mascot-banner { margin: 16px 20px; background: linear-gradient(135deg, #E6F9FF 0%, #F0FFF0 100%); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 14px; border: 2px solid var(--border); }
.mascot { font-size: 64px; line-height: 1; }
.mascot-text h2 { font-size: 15px; font-weight: 800; }
.mascot-text p { font-size: 13px; color: var(--text-light); margin-top: 2px; font-weight: 600; }
.section-label { font-size: 13px; font-weight: 800; color: var(--text-light); letter-spacing: .05em; text-transform: uppercase; padding: 0 20px; margin: 16px 0 8px; }
.unit-path { padding: 0 20px 20px; display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 0; }
@media (max-width: 600px) { .unit-path { flex-direction: column; align-items: center; } }
.path-node { display: flex; flex-direction: column; align-items: center; }
.node-btn { width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: transform .1s, box-shadow .1s; }
.node-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.node-btn.vocab { background: var(--green); }
.node-btn.listen { background: var(--blue); }
.node-btn.read { background: var(--purple); }
.node-connector { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin-top: 34px; }
@media (max-width: 600px) { .node-connector { width: 4px; height: 28px; margin-top: 0; } }
.node-label { font-size: 12px; font-weight: 800; color: var(--text-light); margin-top: 6px; margin-bottom: 2px; }
.node-stars { display: flex; gap: 2px; margin-bottom: 12px; font-size: 14px; }
.daily-goal-card { margin: 8px 20px; background: var(--blue-light); border-radius: var(--radius); padding: 14px 16px; border: 2px solid #B3E5FC; }
.daily-goal-title { font-size: 13px; font-weight: 800; color: var(--blue); margin-bottom: 8px; }
.xp-bar-wrap { height: 14px; background: #fff; border-radius: 99px; overflow: hidden; border: 2px solid #B3E5FC; }
.xp-bar-fill { height: 100%; background: var(--blue); border-radius: 99px; transition: width .4s; }
.xp-bar-label { font-size: 12px; font-weight: 700; color: var(--blue); margin-top: 6px; text-align: right; }

/* LESSON */
.lesson-header { padding: 16px 20px 0; display: flex; align-items: center; gap: 12px; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-light); flex-shrink: 0; }
.lesson-progress-bar { flex: 1; height: 14px; background: #F0F0F0; border-radius: 99px; overflow: hidden; border: 2px solid var(--border); }
.lesson-progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width .4s; }
.lesson-body { padding: 20px; padding-bottom: 180px; }
.lesson-type-badge { display: inline-block; background: var(--green-light); color: var(--green-dark); font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
.lesson-question { font-size: 18px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
.lesson-sub { font-size: 13px; color: var(--text-light); font-weight: 600; font-style: italic; background: #F7F7F7; border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 20px; line-height: 1.6; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 600px) { .choices-2col { grid-template-columns: repeat(2, 1fr); } }
.choice { padding: 14px 16px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: #fff; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; color: var(--text); box-shadow: 0 4px 0 var(--border); transition: border-color .15s, background .15s; }
.choice:hover:not([disabled]) { border-color: var(--blue); background: var(--blue-light); }
.choice.selected { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 4px 0 #B3E5FC; }
.choice.correct { border-color: var(--green); background: var(--green-light); box-shadow: 0 4px 0 #A0D870; color: var(--green-dark); }
.choice.wrong { border-color: var(--red); background: var(--red-light); box-shadow: 0 4px 0 #FFACAC; color: var(--red); }
.check-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); border: none; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 16px; }
.check-btn.ready { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
.check-btn.ready:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
.check-btn.disabled { background: #E5E5E5; color: #AFAFAF; box-shadow: 0 4px 0 #CACACA; cursor: default; }
.feedback-bar { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 720px; padding: 16px 20px 20px; display: none; z-index: 200; border-radius: 16px 16px 0 0; }
.feedback-bar.show { display: block; }
.feedback-bar.correct-bar { background: var(--green-light); border-top: 3px solid var(--green); }
.feedback-bar.wrong-bar { background: var(--red-light); border-top: 3px solid var(--red); }
.fb-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.fb-title.ok { color: var(--green-dark); }
.fb-title.ng { color: var(--red); }
.fb-body { font-size: 13px; font-weight: 600; margin-bottom: 12px; line-height: 1.6; }
.fb-next { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 800; cursor: pointer; }
.fb-next.ok { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
.fb-next.ng { background: var(--red); color: #fff; box-shadow: 0 4px 0 #CC0000; }

/* COMPLETE */
.complete-screen { text-align: center; padding: 40px 20px; }
.complete-emoji { font-size: 80px; margin-bottom: 16px; animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
.complete-title { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
.complete-sub { font-size: 15px; color: var(--text-light); font-weight: 600; margin-bottom: 32px; }
.stat-row { display: flex; justify-content: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
.stat-box { background: #F7F7F7; border-radius: var(--radius); padding: 16px 20px; text-align: center; border: 2px solid var(--border); min-width: 80px; }
.stat-val { font-size: 26px; font-weight: 900; }
.stat-lbl { font-size: 12px; font-weight: 700; color: var(--text-light); margin-top: 2px; }
.home-btn { padding: 16px 40px; border-radius: var(--radius-sm); border: none; background: var(--green); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--green-dark); }

/* PROFILE */
.profile-header { padding: 24px 20px 16px; text-align: center; }
.avatar-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
.avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 42px; border: 4px solid var(--border); cursor: pointer; }
.avatar-edit { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; }
.profile-name { font-size: 20px; font-weight: 900; }
.profile-sub { font-size: 13px; color: var(--text-light); font-weight: 600; margin-top: 2px; }
.edit-btn { margin-top: 10px; padding: 6px 16px; border-radius: 99px; border: 2px solid var(--blue); background: transparent; color: var(--blue); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.stats-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 20px 16px; }
@media (max-width: 600px) { .stats-cards { grid-template-columns: 1fr 1fr; } }
.stats-card { background: #F7F7F7; border-radius: var(--radius); padding: 16px; border: 2px solid var(--border); text-align: center; }
.stats-card-val { font-size: 26px; font-weight: 900; }
.stats-card-lbl { font-size: 12px; font-weight: 700; color: var(--text-light); margin-top: 2px; }
.achievements-section { padding: 0 20px 20px; }
.achievements-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
.badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.badge-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; border: 3px solid; }
.badge-icon.earned { border-color: #FFD900; background: #FFFDE7; }
.badge-icon.locked { border-color: var(--border); background: #F7F7F7; opacity: 0.35; }
.badge-name { font-size: 10px; font-weight: 700; color: var(--text-light); text-align: center; }

/* READING */
.passage-box { background: #F7F7F7; border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.9; max-height: 300px; overflow-y: auto; border: 2px solid var(--border); }
.passage-box p { margin-bottom: .7rem; }
.passage-box p:last-child { margin-bottom: 0; }
.q-nav { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.q-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); background: #fff; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-light); }
.q-dot.q-active { background: var(--blue); color: #fff; border-color: var(--blue); }
.q-dot.q-ok { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
.q-dot.q-ng { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: var(--radius); padding: 24px; width: 90%; max-width: 360px; }
.modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
.modal-section { margin-bottom: 16px; }
.modal-section label { font-size: 13px; font-weight: 700; color: var(--text-light); display: block; margin-bottom: 6px; }
.modal-input { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 2px solid var(--border); font-size: 15px; font-family: inherit; color: var(--text); }
.modal-input:focus { outline: none; border-color: var(--blue); }
.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.emoji-opt { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border); background: #F7F7F7; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.emoji-opt.selected { border-color: var(--blue); background: var(--blue-light); }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
.modal-btn.cancel { background: #F0F0F0; color: var(--text); }
.modal-btn.save { background: var(--blue); color: #fff; }

/* LISTENING */
.script-box { background: #F7F7F7; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.8; border: 2px solid var(--border); }
.audio-player { display: flex; align-items: center; gap: 12px; background: #F0F8FF; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; border: 2px solid #B3E5FC; }
.rate-btn { padding: 3px 8px; border-radius: 99px; border: 1.5px solid var(--blue); background: transparent; color: var(--blue); font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit; }
.rate-btn.rate-active { background: var(--blue); color: #fff; }
.play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); border: none; cursor: pointer; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.audio-wave { display: flex; align-items: center; gap: 3px; height: 24px; }
.abar { width: 3px; background: var(--blue); border-radius: 99px; animation: wave 1s ease-in-out infinite; }
.abar:nth-child(1){height:6px;animation-delay:0s}.abar:nth-child(2){height:14px;animation-delay:.1s}.abar:nth-child(3){height:10px;animation-delay:.2s}.abar:nth-child(4){height:18px;animation-delay:.3s}.abar:nth-child(5){height:12px;animation-delay:.4s}
@keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.6)} }
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="screen-home"></div>
  <div class="screen" id="screen-lesson"></div>
  <div class="screen" id="screen-profile"></div>

  <div class="feedback-bar" id="feedback-bar">
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-body" id="fb-body"></div>
    <button class="fb-next" id="fb-next"></button>
  </div>

  <!-- プロフィール編集モーダル -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3>プロフィールを編集</h3>
      <div class="modal-section">
        <label>表示名</label>
        <input class="modal-input" id="edit-name" type="text" maxlength="20" placeholder="名前を入力">
      </div>
      <div class="modal-section">
        <label>アイコン</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="closeModal()">キャンセル</button>
        <button class="modal-btn save" onclick="saveProfile()">保存</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="showHome()">
      <span class="nav-icon">🏠</span>ホーム
    </div>
    <div class="nav-item" id="nav-profile" onclick="showProfile()">
      <span class="nav-icon">👤</span>プロフィール
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'eiken2_v2';
const AVATARS = ['🦜','🦊','🐼','🐯','🦁','🐸','🐧','🐨','🦄','🐉','🐺','🦋'];

let state = {
  xp: 0, streak: 1, gems: 50, hearts: 5,
  lessonsCompleted: 0, totalCorrect: 0, totalAnswered: 0,
  unitsProgress: { vocab: 0, listen: 0, read: 0 },
  lastDate: new Date().toDateString(),
  profileName: 'がんばり屋さん',
  profileAvatar: '🦜',
  selectedAvatar: '🦜',
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      const today = new Date().toDateString();
      const diff = Math.floor((new Date(today) - new Date(p.lastDate)) / 86400000);
      if (diff === 1) { p.streak = (p.streak || 1) + 1; p.hearts = 5; }
      else if (diff > 1) { p.streak = 1; p.hearts = 5; }
      p.lastDate = today;
      state = { ...state, ...p };
    }
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ── DATA ──
const vocabData = [
  { word: "perceive", phonetic: "/pəˈsiːv/", sentence: "Many people ___ studying abroad as a great opportunity.", choices: ["知覚する・理解する","拒絶する・断る","悪化させる","依存する"], correct: 0 },
  { word: "inevitable", phonetic: "/ɪnˈevɪtəbl/", sentence: "Change is ___; no matter how much we resist it.", choices: ["避けられない・必然的な","信頼できる","考えられない","効果的な"], correct: 0 },
  { word: "diminish", phonetic: "/dɪˈmɪnɪʃ/", sentence: "Lack of sleep can ___ a person's ability to concentrate.", choices: ["減少する・弱める","強化する・増大させる","確認する","分類する"], correct: 0 },
  { word: "obligation", phonetic: "/ˌɒblɪˈɡeɪʃn/", sentence: "Citizens have an ___ to follow the laws of their country.", choices: ["義務・責任","機会・好機","不満","推測"], correct: 0 },
  { word: "consecutive", phonetic: "/kənˈsekjətɪv/", sentence: "The team won five ___ games, setting a new record.", choices: ["連続した","一時的な","自発的な","相互的な"], correct: 0 },
  { word: "ambiguous", phonetic: "/æmˈbɪɡjuəs/", sentence: "The instructions were so ___ that no one knew what to do.", choices: ["あいまいな・不明確な","明確な","退屈な","攻撃的な"], correct: 0 },
  { word: "compensate", phonetic: "/ˈkɒmpənseɪt/", sentence: "The company agreed to ___ workers for the extra hours.", choices: ["補償する・埋め合わせる","強調する","悪化させる","比較する"], correct: 0 },
  { word: "negotiate", phonetic: "/nɪˈɡəʊʃieɪt/", sentence: "Both sides agreed to ___ a new trade agreement.", choices: ["交渉する・協議する","否定する・拒絶する","調査する","規制する"], correct: 0 },
  { word: "persistent", phonetic: "/pəˈsɪstənt/", sentence: "Despite many failures, her ___ efforts finally paid off.", choices: ["粘り強い・しつこい","一時的な・短命な","寛大な","脆弱な"], correct: 0 },
  { word: "abolish", phonetic: "/əˈbɒlɪʃ/", sentence: "The government decided to ___ the old tax system.", choices: ["廃止する・撤廃する","設立する・制定する","維持する","強化する"], correct: 0 },
  { word: "controversy", phonetic: "/ˈkɒntrəvɜːsi/", sentence: "The new policy sparked great ___ among local residents.", choices: ["論争・議論","協力・協調","成功・達成","遠慮・謙虚さ"], correct: 0 },
  { word: "deteriorate", phonetic: "/dɪˈtɪəriəreɪt/", sentence: "His health began to ___ after he stopped taking his medicine.", choices: ["悪化する・低下する","改善する・向上する","集中する","推測する"], correct: 0 },
  { word: "distribute", phonetic: "/dɪˈstrɪbjuːt/", sentence: "Volunteers helped ___ food and water to those affected by the flood.", choices: ["配布する・分配する","禁止する・制限する","評価する","収集する"], correct: 0 },
  { word: "magnificent", phonetic: "/mæɡˈnɪfɪsnt/", sentence: "The view from the mountaintop was absolutely ___.", choices: ["壮大な・素晴らしい","平凡な・ありきたりな","不安定な","厳格な"], correct: 0 },
  { word: "resign", phonetic: "/rɪˈzaɪn/", sentence: "The manager decided to ___ after disagreements with the board.", choices: ["辞職する・辞任する","再開する・再び始める","設計する","署名する"], correct: 0 },
  { word: "prospect", phonetic: "/ˈprɒspekt/", sentence: "The ___ of working overseas excited her more than any other option.", choices: ["見込み・可能性","障害・困難","証拠・根拠","負担・義務"], correct: 0 },
  { word: "adequate", phonetic: "/ˈædɪkwət/", sentence: "Make sure you get ___ sleep before the exam.", choices: ["十分な・適切な","過剰な・必要以上の","不十分な","不規則な"], correct: 0 },
  { word: "apparent", phonetic: "/əˈpærənt/", sentence: "It was ___ that she was nervous from the moment she entered.", choices: ["明らかな・見かけ上の","不明な・曖昧な","重要な","珍しい"], correct: 0 },

const readingPassage = "<p>In recent decades, the concept of remote work has gained considerable attention. While the idea existed long before the twenty-first century, it was the rapid advancement of communication technology and, more dramatically, the global outbreak of COVID-19 in 2020 that transformed remote work from a privilege enjoyed by a small number of professionals into a widespread practice affecting millions of workers worldwide.</p><p>Proponents of remote work point to several significant advantages. Studies have shown that many employees report higher levels of job satisfaction and productivity when working from home, partly because they can avoid long commutes, set their own schedules, and work in environments tailored to their personal preferences. Employers, too, have benefited in some cases, with reduced overhead costs resulting from smaller office spaces and the ability to hire talent from a broader geographic area.</p><p>However, remote work is not without its drawbacks. A recurring concern is the blurring of boundaries between professional and personal life. Without the physical separation of an office, some workers find it difficult to switch off, leading to longer working hours and increased stress. Social isolation is another issue; the casual conversations and spontaneous collaboration that occur naturally in an office environment are difficult to replicate online.</p><p>Organizations have responded to these challenges in various ways. Many companies have adopted a hybrid model, in which employees divide their time between working remotely and attending the office. This approach attempts to balance the flexibility valued by workers with the collaborative benefits of in-person interaction.</p>";

// ── SOUND EFFECTS ──
function playSound(type) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.setValueAtTime(180, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}
let isSpeaking = false;
let speechRate = 0.88; // デフォルト速度

function speakCurrent(btnId) {

    return line.replace(/^[A-Z]\s*:\s*/, '');
  });

}

// 起動時に声を確保する
var voiceA = null; // 声1（例：女性）
var voiceB = null; // 声2（例：男性）

function loadVoices() {
  var voices = speechSynth.getVoices();
  var enVoices = voices.filter(function(v) {
    return v.lang.startsWith('en') && !v.localService === false || v.lang.startsWith('en');
  });

  if (enVoices.length === 0) return;

  // 優先する女性・男性の声名リスト
  var femaleNames = ['Samantha','Karen','Moira','Zira','Victoria','Fiona','Tessa','Hazel','Susan','Catherine','Allison','Ava','Nicky'];
  var maleNames   = ['Daniel','Alex','Fred','Tom','David','Mark','James','Lee','Oliver','Arthur','Aaron','Gordon','Bob','Bruce'];

  // 女性の声を探す
  for (var i = 0; i < femaleNames.length; i++) {
    var found = enVoices.find(function(v) { return v.name.includes(femaleNames[i]); });
    if (found) { voiceA = found; break; }
  }

  // 男性の声を探す
  for (var i = 0; i < maleNames.length; i++) {
    var found = enVoices.find(function(v) { return v.name.includes(maleNames[i]); });
    if (found) { voiceB = found; break; }
  }

  // 見つからなかった場合は先頭2つを使う
  if (!voiceA && enVoices.length > 0) voiceA = enVoices[0];
  if (!voiceB && enVoices.length > 1) voiceB = enVoices[1];
  if (!voiceB && enVoices.length > 0) voiceB = enVoices[0];

  console.log('Voice A:', voiceA ? voiceA.name : 'none');
  console.log('Voice B:', voiceB ? voiceB.name : 'none');
}

// 声を読み込む（ブラウザによってタイミングが異なる）
if (speechSynth.getVoices().length > 0) {
  loadVoices();
} else {
  speechSynth.onvoiceschanged = loadVoices;
}

function speakScript(lines, btnId) {
  if (!speechSynth) {
    alert("お使いのブラウザは音声再生に対応していません。スクリプトを読んで練習してください。");
    return;
  }
  speechSynth.cancel();
  if (isSpeaking) {
    isSpeaking = false;
    updatePlayBtn(btnId, false);
    return;
  }

  // 声がまだ読み込まれていなければ再試行
  if (!voiceA) { loadVoices(); }

  isSpeaking = true;
  updatePlayBtn(btnId, true);

  var idx = 0;
  function speakNext() {
    if (idx >= lines.length) {
      isSpeaking = false;
      updatePlayBtn(btnId, false);
      updatePlayCount(btnId);
      return;
    }
    var utter = new SpeechSynthesisUtterance(lines[idx]);
    utter.lang = 'en-US';
    utter.rate = speechRate;

    if (idx % 2 === 0) {
      // 偶数行：声A（女性）
      if (voiceA) utter.voice = voiceA;
      utter.pitch = 1.1;
    } else {
      // 奇数行：声B（男性）
      if (voiceB) utter.voice = voiceB;
      utter.pitch = 0.9;
    }

    utter.onend = function() { idx++; setTimeout(speakNext, 250); };
    utter.onerror = function() { isSpeaking = false; updatePlayBtn(btnId, false); };
    speechSynth.speak(utter);
  }
  speakNext();
}

function updatePlayBtn(btnId, playing) {
  var btn = document.getElementById(btnId);
  var wave = document.getElementById('audio-wave-' + btnId);
  if (btn) btn.textContent = playing ? '⏸' : '▶';
  if (wave) wave.style.display = playing ? 'flex' : 'none';
}

function updatePlayCount(btnId) {
  playCount[btnId] = (playCount[btnId] || 0) + 1;
  var el = document.getElementById('play-count-' + btnId);
  if (el) el.textContent = playCount[btnId] + '回再生';
}

function startLesson(type) {
  if (speechSynth) speechSynth.cancel();
  isSpeaking = false;
  currentLesson = type;
  currentQ = 0;
  lessonCorrect = 0;
  selectedChoice = null;
  answered = false;
  readingAnswered = [];
  if (type === 'vocab') {
    lessonQs = shuffleArray(vocabData).slice(0, 20);
  } else if (type === 'listen') {
    lessonQs = shuffleArray(listeningData).slice(0, 10);
  } else {
    currentReadingPassage = Math.floor(Math.random() * readingPassages.length);
    lessonQs = readingPassages[currentReadingPassage].questions;
  }
  setNav('lesson');
  renderQuestion();
}

        '</div>' +
      '</div>' +
      '<div class="script-box">' + q.script.map(function(s) { return '<div>' + s + '</div>'; }).join('') + '</div>' +
      '<div style="font-size:14px;font-weight:800;margin-bottom:14px">Q: ' + q.q + '</div>' +
      '<div class="choices" id="choices">' +
        q.choices.map(function(c, i) { return '<button class="choice" onclick="selectChoice(this,' + i + ')"><span style="color:var(--blue);font-weight:800;margin-right:8px">' + String.fromCharCode(65+i) + '</span>' + c + '</button>'; }).join('') +
      '</div>' +
      '<button class="check-btn disabled" id="check-btn" onclick="checkAnswer()">確認する</button>';
  }

  document.getElementById('screen-lesson').innerHTML =
    '<div class="lesson-header">' +
      '<button class="back-btn" onclick="goHome()">✕</button>' +
      '<div class="lesson-progress-bar"><div class="lesson-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div>' + '❤️'.repeat(Math.max(0, state.hearts)) + '</div>' +
    '</div>' +
    '<div class="lesson-body">' + bodyHTML + '</div>';
  selectedChoice = null;
  answered = false;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function shuffleOpts(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var vocabCorrectIdx = null;
function selectVocabChoice(btn, idx, ok) {
  if (answered) return;
  document.querySelectorAll('#choices .choice').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  selectedChoice = idx;
  vocabCorrectIdx = ok;
  var cb = document.getElementById('check-btn');
  if (cb) cb.className = 'check-btn ready';
}

function checkVocabAnswer() {
  if (selectedChoice === null || answered) return;
  answered = true;
  var ok = vocabCorrectIdx;
  var correctText = vocabData[currentQ].choices[vocabData[currentQ].correct];
  document.querySelectorAll('#choices .choice').forEach(function(b, i) {
    b.onclick = null; b.disabled = true;
    if (b.textContent.trim() === correctText) b.classList.add('correct');
  });
  var selected = document.querySelectorAll('#choices .choice')[selectedChoice];
  if (!ok) selected.classList.add('wrong');
  if (ok) { lessonCorrect++; state.totalCorrect++; } else if (state.hearts > 0) state.hearts--;
  state.totalAnswered++;
  showFeedback(ok, correctText, '', false);
  saveState();
}

function selectChoice(btn, idx) {
  if (answered) return;
  document.querySelectorAll('#choices .choice').forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
  selectedChoice = idx;
  var cb = document.getElementById('check-btn');
  if (cb) cb.className = 'check-btn ready';
}

function checkAnswer() {
  if (selectedChoice === null || answered) return;
  answered = true;
  var q = lessonQs[currentQ];
  var ok = selectedChoice === q.correct;
  document.querySelectorAll('#choices .choice').forEach(function(b, i) {
    b.onclick = null; b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
  });
  var selBtn = document.querySelectorAll('#choices .choice')[selectedChoice];
  if (!ok) selBtn.classList.add('wrong');
  if (ok) { lessonCorrect++; state.totalCorrect++; } else if (state.hearts > 0) state.hearts--;
  state.totalAnswered++;
  showFeedback(ok, q.choices[q.correct], q.ex || '', false);
  saveState();
}

// ── READING ──
function renderReadingLesson() {
  var total = readingQs.length;
  var done = readingAnswered.filter(function(x) { return x !== undefined; }).length;
  var pct = Math.round((done / total) * 100);
  var q = readingQs[currentQ];
  var isAnswered = readingAnswered[currentQ] !== undefined;
  var allDone = done === total;

  var dotHTML = readingQs.map(function(_, i) {
    var cls = 'q-dot';
    if (i === currentQ) cls += ' q-active';
    if (readingAnswered[i] === true) cls += ' q-ok';
    else if (readingAnswered[i] === false) cls += ' q-ng';
    // 回答済みの問題のみクリック可能
    var clickable = (readingAnswered[i] !== undefined) || i === currentQ;
    var onclick = clickable ? 'onclick="jumpReadingQ(' + i + ')"' : '';
    var style = !clickable ? 'style="cursor:default;opacity:0.4"' : '';
    return '<button class="' + cls + '" ' + onclick + ' ' + style + '>' + (i+1) + '</button>';
  }).join('');

  var choicesHTML = q.choices.map(function(c, i) {
    var cls = 'choice';
    if (isAnswered) {
      if (i === q.correct) cls += ' correct';
      else if (readingAnswered[currentQ] === false && i === currentQ) cls += ' wrong';
    }
    return '<button class="' + cls + '"' + (isAnswered ? ' disabled' : '') + ' onclick="checkReadingAnswer(this,' + i + ',' + (i === q.correct ? 'true' : 'false') + ')"><span style="color:var(--blue);font-weight:800;margin-right:8px">' + String.fromCharCode(65+i) + '</span>' + c + '</button>';
  }).join('');

  var extraBtn = '';
  if (isAnswered && currentQ < total-1) extraBtn = '<button class="check-btn ready" style="margin-top:16px" onclick="hideFeedback();jumpReadingQ(' + (currentQ+1) + ')">次の問題 →</button>';
  if (allDone) extraBtn = '<button class="check-btn ready" style="margin-top:16px;background:var(--purple);box-shadow:0 4px 0 #9900CC" onclick="completeLesson()">レッスン完了！</button>';

  document.getElementById('screen-lesson').innerHTML =
    '<div class="lesson-header">' +
      '<button class="back-btn" onclick="goHome()">✕</button>' +
      '<div class="lesson-progress-bar"><div class="lesson-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div>' + '❤️'.repeat(Math.max(0, state.hearts)) + '</div>' +
    '</div>' +
    '<div class="lesson-body">' +
      '<div class="lesson-type-badge">長文読解 — ' + readingPassages[currentReadingPassage].title + '</div>' +
      '<div class="passage-box">' + readingPassages[currentReadingPassage].passage + '</div>' +
      '<div class="q-nav">' + dotHTML + '</div>' +
      '<div style="font-size:14px;font-weight:800;margin-bottom:14px">Q' + (currentQ+1) + ': ' + q.q + '</div>' +
      '<div class="choices" id="choices">' + choicesHTML + '</div>' +
      extraBtn +
    '</div>';

  if (isAnswered) {
    showFeedback(readingAnswered[currentQ], q.choices[q.correct], q.ex, true);
    var nb = document.getElementById('fb-next');
    if (allDone) { nb.textContent = 'レッスン完了！'; nb.onclick = completeLesson; }
    else { nb.textContent = '次の問題 →'; nb.onclick = function() { hideFeedback(); jumpReadingQ(currentQ+1); }; }
  }
}

function jumpReadingQ(i) { hideFeedback(); currentQ = i; renderReadingLesson(); }

function checkReadingAnswer(btn, idx, ok) {
  document.querySelectorAll('#choices .choice').forEach(function(b, i) {
    b.onclick = null; b.disabled = true;
    if (i === readingQs[currentQ].correct) b.classList.add('correct');
  });
  if (!ok) btn.classList.add('wrong');
  readingAnswered[currentQ] = ok;
  if (ok) { lessonCorrect++; state.totalCorrect++; } else if (state.hearts > 0) state.hearts--;
  state.totalAnswered++;
  var total = readingQs.length;
  var allDone = readingAnswered.filter(function(x) { return x !== undefined; }).length === total;
  showFeedback(ok, readingQs[currentQ].choices[readingQs[currentQ].correct], readingQs[currentQ].ex, true);
  var nb = document.getElementById('fb-next');
  if (allDone) { nb.textContent = 'レッスン完了！'; nb.onclick = completeLesson; }
  else { nb.textContent = '次の問題 →'; nb.onclick = function() { hideFeedback(); jumpReadingQ(currentQ+1); }; }
  saveState();
}

// ── FEEDBACK ──
function showFeedback(ok, correctAnswer, ex, isReading) {
  playSound(ok ? 'correct' : 'wrong');
  var bar = document.getElementById('feedback-bar');
  var title = document.getElementById('fb-title');
  var body = document.getElementById('fb-body');
  var next = document.getElementById('fb-next');
  bar.className = 'feedback-bar show ' + (ok ? 'correct-bar' : 'wrong-bar');
  title.className = 'fb-title ' + (ok ? 'ok' : 'ng');
  title.textContent = ok ? '🎉 正解！' : '😢 不正解';
  body.textContent = ok ? (ex || '素晴らしい！') : ('正解は「' + correctAnswer + '」' + (ex ? '。' + ex : ''));
  next.className = 'fb-next ' + (ok ? 'ok' : 'ng');
  if (!isReading) { next.textContent = '次へ →'; next.onclick = nextQuestion; }
}

function hideFeedback() { document.getElementById('feedback-bar').className = 'feedback-bar'; }

function nextQuestion() {
  hideFeedback();
  currentQ++;
  if (currentQ >= lessonQs.length) completeLesson();
  else renderQuestion();
}

function completeLesson() {
  if (speechSynth) speechSynth.cancel();
  isSpeaking = false;
  hideFeedback();
  var total = currentLesson === 'read' ? readingQs.length : lessonQs.length;
  var xpEarned = lessonCorrect * 10;
  state.xp += xpEarned;
  state.gems += 5;
  state.lessonsCompleted++;
  var acc = Math.round(lessonCorrect / total * 100);
  var stars = acc >= 90 ? 3 : acc >= 60 ? 2 : 1;
  if (state.unitsProgress[currentLesson] < stars) state.unitsProgress[currentLesson] = stars;
  saveState();
  document.getElementById('screen-lesson').innerHTML =
    '<div class="complete-screen">' +
      '<div class="complete-emoji">' + (acc >= 90 ? '🏆' : acc >= 60 ? '⭐' : '👍') + '</div>' +
      '<div class="complete-title">レッスン完了！</div>' +
      '<div class="complete-sub">' + (acc >= 90 ? '完璧な出来栄え！' : acc >= 60 ? 'よくできました！' : '次回はもっと頑張ろう！') + '</div>' +
      '<div class="stat-row">' +
        '<div class="stat-box"><div class="stat-val">+' + xpEarned + '</div><div class="stat-lbl">XP獲得</div></div>' +
        '<div class="stat-box"><div class="stat-val">' + acc + '%</div><div class="stat-lbl">正解率</div></div>' +
        '<div class="stat-box"><div class="stat-val">⭐' + stars + '</div><div class="stat-lbl">スター</div></div>' +
      '</div>' +
      '<button class="home-btn" onclick="showHome()">ホームへ戻る</button>' +
    '</div>';
}

// ── NAVIGATION ──
function goHome() {
  if (speechSynth) speechSynth.cancel();
  isSpeaking = false;
  showHome();
}

function setNav(screen) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var nav = document.querySelector('.bottom-nav');
  if (screen === 'home') {
    document.getElementById('screen-home').classList.add('active');
    document.getElementById('nav-home').classList.add('active');
    nav.style.display = 'flex';
  } else if (screen === 'profile') {
    document.getElementById('screen-profile').classList.add('active');
    document.getElementById('nav-profile').classList.add('active');
    nav.style.display = 'flex';
  } else {
    document.getElementById('screen-lesson').classList.add('active');
    nav.style.display = 'none';
  }
}

function showHome() { hideFeedback(); renderHome(); setNav('home'); }
function showProfile() { renderProfile(); setNav('profile'); }

loadState();
renderHome();
</script>
</body>
</html>
